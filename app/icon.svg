<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#0a0a0f" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#brandGrad)" stroke-width="8" opacity="0.5" />
  <!-- 4 agent nodes -->
  <circle cx="160" cy="160" r="36" fill="#7c5cff" />
  <circle cx="352" cy="160" r="36" fill="#7c5cff" />
  <circle cx="160" cy="352" r="36" fill="#7c5cff" />
  <circle cx="352" cy="352" r="36" fill="#7c5cff" />
  <!-- edges: top row, bottom row, left col, right col -->
  <line x1="196" y1="160" x2="316" y2="160" stroke="#a78bfa" stroke-width="12" stroke-linecap="round" opacity="0.6" />
  <line x1="196" y1="352" x2="316" y2="352" stroke="#a78bfa" stroke-width="12" stroke-linecap="round" opacity="0.6" />
  <line x1="160" y1="196" x2="160" y2="316" stroke="#a78bfa" stroke-width="12" stroke-linecap="round" opacity="0.4" />
  <line x1="352" y1="196" x2="352" y2="316" stroke="#a78bfa" stroke-width="12" stroke-linecap="round" opacity="0.4" />
  <!-- diagonal: top-left to bottom-right -->
  <line x1="187" y1="187" x2="325" y2="325" stroke="#7c5cff" stroke-width="8" stroke-linecap="round" opacity="0.5" />
  <!-- node cores -->
  <circle cx="160" cy="160" r="14" fill="#ffffff" opacity="0.55" />
  <circle cx="352" cy="160" r="14" fill="#ffffff" opacity="0.55" />
  <circle cx="160" cy="352" r="14" fill="#ffffff" opacity="0.55" />
  <circle cx="352" cy="352" r="14" fill="#ffffff" opacity="0.55" />
</svg>
